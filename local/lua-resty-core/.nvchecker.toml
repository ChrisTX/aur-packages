# The releases of lua-resty-core, tagged v<version>, rc tags included: OpenResty's releases take
# them; take the one OpenResty bundles with nginx-mod-lua's version
[lua-resty-core]
source = "git"
git = "https://github.com/openresty/lua-resty-core.git"
use_max_tag = true
prefix = "v"
sort_version_key = "vercmp"
