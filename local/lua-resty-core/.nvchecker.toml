# The releases of lua-resty-core, tagged v<version>, rc tags included as OpenResty's releases take
# them: the newest. Upstream releases it together with lua-nginx-module (local/nginx-mod-lua), whose
# version has to move with it
[lua-resty-core]
source = "git"
git = "https://github.com/openresty/lua-resty-core.git"
use_max_tag = true
prefix = "v"
sort_version_key = "vercmp"
