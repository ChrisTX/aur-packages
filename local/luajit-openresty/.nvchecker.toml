# The releases of OpenResty's LuaJIT, tagged v2.1-<date>, for the pkgver 2.1.<date>; not its
# betas of 2.1.0
[luajit-openresty]
source = "git"
git = "https://github.com/openresty/luajit2.git"
use_max_tag = true
include_regex = 'v2\.1-\d{8}'
from_pattern = 'v2\.1-(\d{8})'
to_pattern = '2.1.\1'
sort_version_key = "vercmp"
