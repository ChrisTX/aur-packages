# Runs the checks of .pre-commit-config.yaml (./aur-packages check), which the git hooks run before each commit
name: Checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ./aur-packages check
    runs-on: ubuntu-26.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      # Before the checkout, which only makes a git repository with git installed
      - name: Install the tools of the checks
        run: >-
          pacman -Syu --noconfirm --needed git jq prek shfmt shellcheck shellharden ruff biome tombi rumdl typos
          systemd-lsp editorconfig-checker reuse
      # Mago is an AUR package: its static binary from the release
      - name: Install Mago
        env:
          MAGO_VERSION: 1.59.0
          MAGO_SHA256: c536aa948ff1dbcd4f12200088a01f61ca0ea426e92128255b657a797645ec00
        run: |
          name="mago-$MAGO_VERSION-x86_64-unknown-linux-musl"
          # GitHub's release downloads fail now and then (504): try again before failing the checks
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 10 -o /tmp/mago.tar.gz \
            "https://github.com/carthage-software/mago/releases/download/$MAGO_VERSION/$name.tar.gz"
          echo "$MAGO_SHA256  /tmp/mago.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mago.tar.gz -C /tmp
          install -Dm755 "/tmp/$name/mago" /usr/local/bin/mago
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # makepkg, which the .SRCINFO check runs, refuses to run as root
      - name: Add a user for the checks
        run: |
          useradd -m builder
          chown -R builder: .
      # PSScriptAnalyzer comes with powershell-editor-services, an AUR package: the next job runs it
      - name: Run the checks
        run: sudo -H -u builder env SKIP=psscriptanalyzer ./aur-packages check

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner has PowerShell, PSScriptAnalyzer comes from the PowerShell Gallery here
      - name: Install PSScriptAnalyzer and prek
        run: |
          pwsh -NoProfile -NonInteractive -Command 'Install-PSResource -Name PSScriptAnalyzer -TrustRepository'
          pipx install prek
      - name: Run PSScriptAnalyzer
        run: prek run --all-files psscriptanalyzer
