  # Only in the repository of the packages, appended to the hooks of templates/package by ./aur-packages sync
  - repo: local
    hooks:
      - id: templates
        name: package files match templates/package
        language: system
        entry: ./aur-packages sync --dry-run
        pass_filenames: false
        always_run: true
      - id: quoting
        name: quoting of the metadata arrays (shfmt)
        language: system
        entry: ./aur-packages quoting
        files: (^|/)PKGBUILD$
        # Arch Linux's packages in overrides/ keep Arch's style
        exclude: ^overrides/
      - id: pins
        name: pinned commits match pkgver
        language: system
        entry: ./aur-packages pins
        files: (^|/)PKGBUILD$
        # Arch Linux's packages in overrides/ keep Arch's style
        exclude: ^overrides/
      - id: upstream
        name: every patch has an upstream directive
        language: system
        entry: ./aur-packages upstream --check
        files: (^|/)PKGBUILD$
        # Arch Linux's packages in overrides/ keep Arch's style
        exclude: ^overrides/
      - id: keys
        name: the PGP keys of validpgpkeys are shipped in keys/pgp
        language: system
        entry: ./aur-packages keys
        files: (^|/)(\.SRCINFO|keys/pgp/[^/]+\.asc)$
      - id: maintainers
        name: Maintainer and Contributor lines of the PKGBUILDs
        language: system
        entry: ./aur-packages maintainers
        files: (^|/)PKGBUILD$
        # Arch Linux's packages in overrides/ keep Arch's style
        exclude: ^overrides/
      - id: readme
        name: README.md lists every package with its pkgdesc
        language: system
        entry: ./aur-packages readme
        pass_filenames: false
        always_run: true
      - id: mypy
        name: types of aur-packages (mypy)
        language: system
        entry: mypy
        files: ^(aur-packages|aur_packages/.*\.py|tests/.*\.py|pyproject\.toml)$
        pass_filenames: false
      - id: pytest
        name: tests of aur-packages (pytest)
        language: system
        entry: pytest -q
        files: ^(aur-packages|aur_packages/.*\.py|tests/.*\.py|pyproject\.toml)$
        pass_filenames: false
      - id: reuse-lint
        name: reuse lint (reuse)
        language: system
        entry: reuse lint --quiet
        pass_filenames: false
        always_run: true
