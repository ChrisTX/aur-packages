  # Only in the repository of the packages, appended to the hooks of templates/package by ./aur-packages sync
  - repo: local
    hooks:
      - id: templates
        name: package files match templates/package
        language: system
        entry: ./aur-packages sync --check
        pass_filenames: false
        always_run: true
      - id: quoting
        name: quoting of the metadata arrays (shfmt, jq)
        language: system
        entry: ./aur-packages quoting
        files: (^|/)PKGBUILD$
      - id: reuse-lint
        name: reuse lint (reuse)
        language: system
        entry: reuse lint --quiet
        pass_filenames: false
        always_run: true
