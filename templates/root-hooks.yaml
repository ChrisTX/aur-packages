  # Only in the repository of the packages, appended to the hooks of templates/package by ./aur-packages sync
  - repo: local
    hooks:
      - id: templates
        name: package files match templates/package
        language: system
        entry: ./aur-packages sync --check
        pass_filenames: false
        always_run: true
      - id: quoting
        name: quoting of the metadata arrays (shfmt, jq)
        language: system
        entry: ./aur-packages quoting
        files: (^|/)PKGBUILD$
        # Arch Linux's packages in overrides/ keep Arch's style
        exclude: ^overrides/
      - id: pins
        name: pinned commits match pkgver
        language: system
        entry: ./aur-packages pins
        files: (^|/)PKGBUILD$
        # Arch Linux's packages in overrides/ keep Arch's style
        exclude: ^overrides/
      - id: maintainers
        name: Maintainer and Contributor lines of the PKGBUILDs
        language: system
        entry: ./aur-packages maintainers
        files: (^|/)PKGBUILD$
        # Arch Linux's packages in overrides/ keep Arch's style
        exclude: ^overrides/
      - id: readme
        name: README.md lists every package with its pkgdesc
        language: system
        entry: ./aur-packages readme
        pass_filenames: false
        always_run: true
      - id: reuse-lint
        name: reuse lint (reuse)
        language: system
        entry: reuse lint --quiet
        pass_filenames: false
        always_run: true
